name: Secure RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP + Firewall
        shell: pwsh
        run: |
          # RDP enable
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          
          # NLA OFF (zyada compatible)
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          
          # Firewall - Remote Desktop group enable karo (sabse reliable)
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Extra rule bhi daal do
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          Write-Host "RDP Enabled"

      - name: Create RDP User
        id: user
        shell: pwsh
        run: |
          $pass = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 16 | ForEach-Object {[char]$_})
          echo "::add-mask::$pass"
          
          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -Confirm:$false
          }
          
          New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "password=$pass" >> $env:GITHUB_OUTPUT
          Write-Host "User RDP created"

      - name: Install & Connect Tailscale
        id: ts
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $msi = "$env:TEMP\ts.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          Remove-Item $msi -Force

          $hostname = "gh-rdp-$env:GITHUB_RUN_ID"
          
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TS_KEY --hostname=$hostname --accept-dns=false
          
          # IP wait
          $ip = $null
          for ($i=1; $i -le 20; $i++) {
            Start-Sleep 3
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
            if ($ip -match "^\d+\.\d+\.\d+\.\d+$") { break }
            Write-Host "Waiting for IP... $i"
          }
          
          if (-not $ip) { throw "Tailscale IP nahi mila" }
          
          echo "ip=$ip" >> $env:GITHUB_OUTPUT
          echo "hostname=$hostname" >> $env:GITHUB_OUTPUT
          Write-Host "Tailscale IP: $ip"

      - name: Show Details + Keep Alive
        shell: pwsh
        run: |
          $ip = "${{ steps.ts.outputs.ip }}"
          $pass = "${{ steps.user.outputs.password }}"
          
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "  RDP READY"
          Write-Host "=============================================="
          Write-Host "Address  : $ip"
          Write-Host "Username : RDP"
          Write-Host "Password : $pass"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Apne PC pe Tailscale connected hona chahiye!"
          Write-Host "Phir mstsc mein $ip daal ke connect karo."
          Write-Host ""
          
          # 2 hours alive
          $end = (Get-Date).AddMinutes(120)
          while ((Get-Date) -lt $end) {
            Write-Host "[$(Get-Date -Format HH:mm:ss)] Alive..."
            Start-Sleep 300
          }
